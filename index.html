<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GUARDIAN CITIMALL - Portal Utama</title>
    <link rel="icon" type="image/x-icon" href="assets/img/OIP.webp" />

    <!-- Google Fonts (Poppins) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        /* Background Khas Guardian dengan Gradasi Oranye-Hangat */
        background: linear-gradient(
          135deg,
          #fff5f0 0%,
          #ffefe6 50%,
          #ffd8c2 100%
        );
        font-family: "Poppins", sans-serif;
        padding: 20px;
      }

      body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  /* Gambar dengan lapisan overlay oranye-transparan agar teks tetap mudah dibaca */
  background: 
    linear-gradient(rgba(255, 245, 240, 0.88), rgba(255, 239, 230, 0.92)),
    url("assets/img/OIP.webp");
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  min-height: 100vh;
}

      /* =========================
         GUARDIAN MENU CONTAINER
      ========================= */
      .login-container {
        width: 100%;
        max-width: 380px;
        padding: 35px 28px;
        border-radius: 24px;
        background: #ffffff;
        border: 1px solid rgba(255, 102, 0, 0.2);
        box-shadow:
          0 20px 40px rgba(255, 102, 0, 0.12),
          0 10px 25px rgba(0, 0, 0, 0.05);
        text-align: center;
        transition: transform 0.3s ease;
      }

      /* Logo / Header Branding Guardian */
      .brand-logo-wrapper {
        width: 75px;
        height: 75px;
        margin: 0 auto 15px;
        background: #fff5f0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #ffe0cc;
        box-shadow: 0 6px 15px rgba(255, 102, 0, 0.15);
      }

      .brand-logo-wrapper img {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }

      .brand-subtitle {
        font-size: 0.8rem;
        font-weight: 700;
        color: #ff6600;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 2px;
      }

      .menu-title {
        color: #222222;
        font-size: 1.6rem;
        font-weight: 800;
        margin-bottom: 25px;
        letter-spacing: 1px;
      }

      /* =========================
         MENU ITEMS
      ========================= */
      .menu {
        list-style: none;
        padding: 0;
      }

      .menu li {
        margin: 14px 0;
      }

      .menu a {
        display: flex;
        align-items: center;
        gap: 14px;
        text-decoration: none;
        padding: 14px 20px;
        border-radius: 14px;
        background: #fff5f0;
        border: 1.5px solid #ffe0cc;
        color: #333333;
        font-size: 0.95rem;
        font-weight: 600;
        box-shadow: 0 4px 12px rgba(255, 102, 0, 0.04);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      /* =========================
         ICON STYLING
      ========================= */
      .menu a ion-icon {
        font-size: 22px;
        color: #ff6600;
        transition: all 0.3s ease;
      }

      /* =========================
         HOVER EFEK GUARDIAN ORANYE
      ========================= */
      .menu a:hover {
        background: linear-gradient(135deg, #ff6600, #ff8533);
        border-color: #ff6600;
        color: #ffffff;
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 10px 20px rgba(255, 102, 0, 0.3);
      }

      .menu a:hover ion-icon {
        color: #ffffff;
        transform: scale(1.15);
      }

      /* Text Label */
      .menu a span {
        flex: 1;
        text-align: left;
      }

      /* Panah Kecil Petunjuk Klik */
      .menu a::after {
        content: "›";
        font-size: 1.4rem;
        color: #ff6600;
        font-weight: 300;
        transition: all 0.3s ease;
      }

      .menu a:hover::after {
        color: #ffffff;
        transform: translateX(4px);
      }
    </style>

    <!-- Ionicons Script -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>
  </head>

  <body>
    <div class="login-container">
      <!-- Logo Guardian Citimall -->
      <div class="brand-logo-wrapper">
        <img src="assets/img/OIP.webp" alt="Guardian Logo" />
      </div>

      <p class="brand-subtitle">GUARDIAN CITIMALL</p>
      <h2 class="menu-title"> MENU UTAMA </h2>

      <ul class="menu">
        <li>
          <a href="Rute.html">
            <ion-icon name="trophy-outline"></ion-icon>
            <span>Top Brands</span>
          </a>
        </li>

        <li>
          <a href="Informasi.html">
            <ion-icon name="bulb-outline"></ion-icon>
            <span>Information</span>
          </a>
        </li>

        <li>
          <a href="Daftarlist.html">
            <ion-icon name="trending-up-outline"></ion-icon>
            <span>Trending Products</span>
          </a>
        </li>

        <li>
          <a href="Member.html">
            <ion-icon name="people-outline"></ion-icon>
            <span>Guardian Member</span>
          </a>
        </li>
      </ul>
    </div>
  </body>
</html>
